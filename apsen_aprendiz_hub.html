<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#fafbfc;--text:#172033;--muted:#697386;
  --line:#e4e8ee;--line-strong:#d4d9e1;--accent:#0a66c2;--accent-soft:#edf5fc;
  --green:#087a56;--green-soft:#eaf6f1;--amber:#a15c06;--amber-soft:#fff6e8;
  --red:#b42318;--red-soft:#fff0ee;--purple:#6d52b5;--purple-soft:#f3effc;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,40,.04);--max:1240px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}button,input,select,textarea{font:inherit}button{color:inherit}.hidden{display:none!important}svg{display:block}.app{min-height:100vh}

/* Splash */
.splash{position:fixed;inset:0;z-index:9999;background:#fff;display:grid;place-items:center;transition:opacity .28s ease,visibility .28s ease}.splash.out{opacity:0;visibility:hidden}.splash-box{text-align:center;width:min(360px,82vw)}.splash-logo{width:54px;height:54px;border-radius:14px;background:#0a66c2;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:25px;font-weight:700}.splash-box strong{display:block;font-size:20px;letter-spacing:-.3px}.splash-box span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.splash-line{height:3px;background:#eef1f5;border-radius:8px;margin-top:22px;overflow:hidden}.splash-line i{display:block;width:35%;height:100%;background:#0a66c2;border-radius:8px;animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* Header */
.header{height:68px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:80}.header-inner{height:100%;max-width:var(--max);margin:auto;padding:0 20px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:180px}.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}.brand-copy strong{display:block;font-size:12px;line-height:1.15}.brand-copy span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.global-search{position:relative;width:230px}.global-search i,.global-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#778195}.global-search input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:#f8f9fb;padding:0 11px 0 34px;outline:none;font-size:11px}.global-search input:focus{background:#fff;border-color:#9bbfe0;box-shadow:0 0 0 3px rgba(10,102,194,.08)}.nav{display:flex;align-items:stretch;align-self:stretch;margin-left:auto;gap:2px}.nav button{min-width:66px;border:0;border-bottom:3px solid transparent;background:transparent;color:#6b7587;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9.5px;cursor:pointer;padding:6px 8px}.nav button i,.nav button svg{width:19px;height:19px}.nav button:hover{color:var(--text);background:#fafbfc}.nav button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}.header-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:36px;height:36px;border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;position:relative}.icon-btn:hover{background:#f5f7fa}.icon-btn i,.icon-btn svg{width:19px;height:19px}.notify-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#d92d20;right:7px;top:6px;border:2px solid #fff}.header-role-action{display:flex}.header-action-btn,.header-status{height:34px;border-radius:9px;padding:0 11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600}.header-action-btn{border-color:var(--accent);background:var(--accent);color:#fff;cursor:pointer}.header-action-btn i,.header-action-btn svg,.header-status i,.header-status svg{width:14px;height:14px}.header-status.attention{color:#9a5500;background:#fff8ea;border-color:#efd7ae}.profile{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--line)}.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:700}.profile-copy{min-width:82px}.profile-copy strong{display:block;font-size:10px}.profile-copy span{display:block;color:var(--muted);font-size:8.5px;margin-top:2px}.profile select{border:0;background:transparent;outline:none;font-size:10px;max-width:100px;cursor:pointer;color:#475467}

/* Layout */
.main{max-width:var(--max);margin:auto;padding:28px 20px 64px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.page-head h1{margin:0;font-size:23px;line-height:1.2;letter-spacing:-.45px;font-weight:650}.page-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.page-actions{display:flex;gap:8px;align-items:center}.section{display:none}.section.active{display:block;animation:fade .12s ease}@keyframes fade{from{opacity:.7}to{opacity:1}}

/* Primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.card-head h2,.card-head h3{font-size:13px;margin:0;font-weight:650}.card-head p{font-size:9.5px;color:#344054;margin:3px 0 0}.card-body{padding:17px}.btn{border:1px solid transparent;border-radius:9px;min-height:34px;padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;font-weight:600;cursor:pointer}.btn i,.btn svg{width:14px;height:14px}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(.96)}.btn-secondary{background:#fff;border-color:var(--line-strong);color:#344054}.btn-secondary:hover{background:#f8fafc}.btn-ghost{background:transparent;color:var(--accent);padding-left:5px;padding-right:5px}.btn-danger{background:#b42318;color:#fff}.field,.select,.textarea{width:100%;border:1px solid var(--line-strong);border-radius:9px;background:#fff;padding:9px 10px;outline:none;font-size:11px;color:var(--text)}.field:focus,.select:focus,.textarea:focus{border-color:#8bb5dc;box-shadow:0 0 0 3px rgba(10,102,194,.08)}.textarea{min-height:100px;resize:vertical}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:600}.b-green{background:var(--green-soft);color:var(--green)}.b-amber{background:var(--amber-soft);color:var(--amber)}.b-red{background:var(--red-soft);color:var(--red)}.b-blue{background:var(--accent-soft);color:var(--accent)}.b-gray{background:#f2f4f7;color:#667085}.empty{padding:30px 18px;text-align:center;color:#344054;font-size:11px}.grid{display:grid;gap:12px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:15px 16px;min-height:104px}.metric-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.metric-label{font-size:9.5px;color:var(--muted);font-weight:500}.metric-value{font-size:24px;line-height:1.05;font-weight:650;letter-spacing:-.4px;margin-top:8px}.metric-icon{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.metric-icon i,.metric-icon svg{width:15px;height:15px}.metric-foot{font-size:9px;color:#87909e;margin-top:10px}.section-title{font-size:13px;font-weight:650;margin:0}.eyebrow{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.toolbar-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.search-inline{position:relative;min-width:235px}.search-inline i,.search-inline svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#7b8494}.search-inline .field{padding-left:32px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#667085;font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;padding:10px 14px;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:10.5px;vertical-align:middle}.table tbody tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fcfcfd}.person-cell{display:flex;align-items:center;gap:9px;min-width:165px}.person-dot{width:30px;height:30px;border-radius:50%;background:#f0f4f8;color:#48627a;display:grid;place-items:center;font-size:9px;font-weight:700}.person-cell strong{display:block;font-size:10.5px}.person-cell span{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}.progress{height:6px;border-radius:999px;background:#eef1f4;overflow:hidden}.progress i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* Dashboard shared */
.dashboard-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}.dash-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr);gap:12px}.stack{display:grid;gap:12px}.compact-list{display:flex;flex-direction:column}.compact-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.compact-row:last-child{border-bottom:0}.compact-icon{width:32px;height:32px;border-radius:8px;background:#f4f6f8;display:grid;place-items:center;flex:0 0 auto}.compact-icon i,.compact-icon svg{width:15px;height:15px}.compact-row-copy{min-width:0;flex:1}.compact-row-copy strong{display:block;font-size:10.5px}.compact-row-copy span{display:block;font-size:8.8px;color:var(--muted);margin-top:2px}.compact-row em{font-style:normal;font-size:9px;color:#667085}.quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick-action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;text-align:left;cursor:pointer;min-height:78px}.quick-action:hover{background:#fafbfc;border-color:#ccd3dc}.quick-action i,.quick-action svg{width:17px;height:17px;color:var(--accent);margin-bottom:9px}.quick-action strong{display:block;font-size:10px}.quick-action span{display:block;color:var(--muted);font-size:8.5px;margin-top:3px}.chart-card{padding:16px}.chart-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:13px}.chart-card-head h3{margin:0;font-size:12.5px}.chart-card-head p{margin:3px 0 0;font-size:9px;color:var(--muted)}.chart-wrap{height:210px;position:relative}

/* JA */
.ja-reminder{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid #b9d7f1;background:#f5faff;border-radius:11px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left}.ja-reminder:hover{background:#eff7fe}.ja-reminder-icon{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}.ja-reminder-icon i,.ja-reminder-icon svg{width:17px;height:17px}.ja-reminder-copy{flex:1}.ja-reminder-copy small{display:block;font-size:8px;color:var(--accent);font-weight:700;letter-spacing:.08em}.ja-reminder-copy strong{display:block;font-size:10.5px;margin-top:3px}.ja-reminder-copy span{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}.week-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.week-day{border:1px solid var(--line);border-radius:10px;padding:12px;min-height:96px;background:#fff}.week-day.today{border-color:#95bee2;box-shadow:inset 0 0 0 1px #b5d6f3}.week-day.course{background:#f0f9f8;border-color:#cbe8e2}.week-day.extra{background:#fff9ee;border-color:#efd7aa}.week-day small{font-size:8px;color:#8a94a3;text-transform:uppercase}.week-day strong{display:block;font-size:10px;margin-top:10px}.week-day span{display:block;font-size:8.5px;color:var(--muted);margin-top:4px}

/* Gestor */
.team-today{display:flex;flex-direction:column}.team-row{display:grid;grid-template-columns:minmax(180px,1.2fr) 100px 90px 100px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.team-row:last-child{border-bottom:0}.location{display:flex;align-items:center;gap:6px;font-size:9.5px}.location i,.location svg{width:13px;height:13px;color:var(--accent)}.risk-row{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.risk-row:last-child{border-bottom:0}.risk-copy strong{display:block;font-size:10px}.risk-copy span{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}

/* RH */
.rh-summary{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:12px}.risk-table td:last-child{text-align:right}.risk-tag{font-size:8.5px;font-weight:600;border-radius:999px;padding:4px 7px}.risk-tag.ok{background:var(--green-soft);color:var(--green)}.risk-tag.watch{background:var(--amber-soft);color:var(--amber)}.risk-tag.risk{background:var(--red-soft);color:var(--red)}.admin-queue{display:flex;flex-direction:column}.queue-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.queue-item:last-child{border-bottom:0}.queue-item strong{font-size:10px;display:block}.queue-item span{font-size:8.5px;color:var(--muted);display:block;margin-top:3px}.queue-count{font-size:17px;font-weight:650;color:var(--accent)}

/* Espro */
.espro-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;margin-bottom:12px}.espro-toolbar h2{font-size:17px;margin:3px 0 0}.espro-toolbar p{font-size:9.5px;color:var(--muted);margin:4px 0 0}.espro-toolbar-actions{display:flex;gap:8px}.work-queue{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.queue-column{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:280px}.queue-column-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.queue-column-head strong{font-size:10.5px}.queue-column-head span{width:23px;height:23px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:8.5px;font-weight:700}.task-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:8px;cursor:pointer}.task-card:last-child{margin-bottom:0}.task-card:hover{border-color:#c5ccd5}.task-card small{font-size:7.5px;color:var(--accent);font-weight:700;letter-spacing:.07em}.task-card strong{display:block;font-size:9.5px;margin-top:4px}.task-card span{display:block;font-size:8px;color:var(--muted);margin-top:4px}

/* Feed */
.feed-layout{display:grid;grid-template-columns:minmax(0,720px) 280px;gap:14px;justify-content:center}.composer{padding:13px 14px;margin-bottom:12px}.composer-row{display:flex;align-items:center;gap:10px}.composer-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:9px;font-weight:700}.composer-button{flex:1;height:40px;border:1px solid var(--line-strong);background:#fff;border-radius:20px;text-align:left;padding:0 15px;color:#727d8e;font-size:10px;cursor:pointer}.composer-button:hover{background:#fafbfc}.feed-filters{display:flex;gap:6px;margin-bottom:12px}.filter-pill{height:30px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 11px;font-size:9px;color:#5e6878;cursor:pointer}.filter-pill.active{background:var(--accent-soft);border-color:#bed8ee;color:var(--accent);font-weight:600}.post{margin-bottom:12px;overflow:hidden}.post-head{padding:14px 15px 6px;display:flex;gap:10px}.post-avatar{width:40px;height:40px;border-radius:50%;background:#edf2f7;color:#46647e;display:grid;place-items:center;font-size:9px;font-weight:700}.post-author{flex:1}.post-author strong{font-size:10.5px;display:block}.post-author span{font-size:8.5px;color:var(--muted);display:block;margin-top:2px}.post-body{padding:6px 15px 13px}.post-course{font-size:8.5px;color:var(--accent);font-weight:600;margin-bottom:5px}.post-title{font-size:14px;font-weight:650;margin-bottom:7px}.post-text{font-size:10.5px;color:#3f4755;line-height:1.55}.learning-box{margin-top:10px;background:#f8fafc;border-left:3px solid #abcce8;border-radius:7px;padding:9px 10px}.learning-box small{font-size:7.5px;color:#718096;font-weight:600;text-transform:uppercase}.learning-box p{font-size:9.5px;margin:3px 0 0}.skill-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.skill-tag{background:#f1f5f9;color:#4b6278;border-radius:999px;padding:3px 7px;font-size:7.8px}.post-media{display:grid;gap:2px;background:#ed function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function initials(name){return name.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function brToDate(s){const[d,m,y]=s.split('/').map(Number);return new Date(y,m-1,d)}
function toBR(d){return d.toLocaleDateString('pt-BR')}
function toISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function statusBadge(s){const c={Confirmada:'b-green',Justificada:'b-green',Aprovado:'b-green',Agendada:'b-blue','Em análise':'b-amber',Injustificada:'b-red',Recusado:'b-red',Ativo:'b-green'};return `<span class="badge ${c[s]||'b-gray'}">${esc(s)}</span>`}
function nextFriday(from=demoToday){const d=new Date(from);const delta=(5-d.getDay()+7)%7||7;d.setDate(d.getDate()+delta);return d}
function nthWeekday(year,month,weekday,n){const first=new Date(year,month,1);return 1+((weekday-first.getDay()+7)%7)+(n-1)*7}
function wednesdayLabel(date){const next=new Date(date);next.setDate(date.getDate()+7);if(next.getMonth()!==date.getMonth())return 'última quarta-feira do mês';return `${Math.ceil(date.getDate()/7)}ª quarta-feira do mês`}
function scheduleActivity(year,month){const found=state.activities.find(a=>{const d=brToDate(a.date);return d.getFullYear()===year&&d.getMonth()===month});if(found)return found;const day=nthWeekday(year,month,3,3);return {title:'Atividade complementar',date:`${String(day).padStart(2,'0')}/${String(month+1).padStart(2,'0')}/${year}`,desc:'Atividade complementar mensal.',format:'A definir',audience:'Todos os aprendizes',status:'Planejada',confirmed:0,total:7,generated:true}}
function nextActivity(){for(let i=0;i<8;i++){const d=new Date(demoToday.getFullYear(),demoToday.getMonth()+i,1);const a=scheduleActivity(d.getFullYear(),d.getMonth());if(brToDate(a.date)>=demoToday)return a}return state.activities[0]}
function activityReminder(a=nextActivity()){const d=brToDate(a.date);const weekStart=x=>{const y=new Date(x);y.setDate(y.getDate()-((y.getDay()+6)%7));y.setHours(0,0,0,0);return y};const sameWeek=weekStart(d).getTime()===weekStart(demoToday).getTime()&&d>=demoToday;return {headline:sameWeek?'Sua atividade complementar é nesta quarta-feira':`Sua atividade complementar será na ${wednesdayLabel(d)}`,date:d}}

/* Calendar */
function calendarEvents(info,success){const events=[];let d=new Date(info.start),end=new Date(info.end);while(d<end){const dow=d.getDay(),br=toBR(d),iso=toISO(d),a=scheduleActivity(d.getFullYear(),d.getMonth()),isAct=a.date===br;if(calendarFilters.extra&&isAct)events.push({title:a.title,start:iso,allDay:true,classNames:['cal-extra'],extendedProps:{kind:'extra',description:a.desc,dateBR:br,format:a.format}});if(calendarFilters.course&&dow===5)events.push({title:state.profile==='gestor'?'Equipe no Espro':'Curso Espro',start:iso,allDay:true,classNames:['cal-course'],extendedProps:{kind:'course',description:'Dia fixo de curso do programa.',dateBR:br}});if(calendarFilters.company&&!isAct&&dow>=1&&dow<=4&&(state.profile==='aprendiz'||state.profile==='gestor'))events.push({title:state.profile==='gestor'?'Equipe na Apsen':'Apsen',start:iso,allDay:true,classNames:['cal-company'],extendedProps:{kind:'company',description:'Jornada prevista na empresa.',dateBR:br}});if(calendarFilters.absence){const occ=visibleAttendance().filter(x=>x.date===br&&x.type==='Falta');if(occ.length)events.push({title:state.profile==='aprendiz'?`Falta • ${occ[0].status}`:`${occ.length} ocorrência${occ.length>1?'s':''}`,start:iso,allDay:true,classNames:['cal-absence'],extendedProps:{kind:'absence',description:'Ocorrência de frequência.',dateBR:br,occurrences:occ}})}d.setDate(d.getDate()+1)}success(events)}

 renderCalendarUpcoming();setTimeout(()=>{if(!window.FullCalendar){setTimeout(renderCalendar,180);return}fullCalendar=new FullCalendar.Calendar(document.getElementById('fullCalendar'),{locale:'pt-br',initialDate:demoToday,initialView:'dayGridMonth',firstDay:1,weekends:false,height:'auto',fixedWeekCount:false,dayMaxEvents:3,now:demoToday,headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,dayGridWeek,listMonth'},buttonText:{today:'Hoje',month:'Mês',week:'Semana',list:'Lista'},events:calendarEvents,eventContent:i=>({html:`<div class="fc-event-inner"><span class="fc-event-dot"></span><span>${esc(i.event.title)}</span></div>`}),eventClick:i=>showCalendarEvent(i.event)});fullCalendar.render();refreshIcons()},50)}

function renderCalendarUpcoming(){const host=document.getElementById('calendarUpcoming');if(!host)return;const items=[{date:nextFriday(),title:'Curso Espro',sub:'Encontro semanal'},...state.activities.map(a=>({date:brToDate(a.date),title:a.title,sub:`${a.format} • ${wednesdayLabel(brToDate(a.date))}`}))].filter(x=>x.date>=demoToday).sort((a,b)=>a.date-b.date).slice(0,4);host.innerHTML=items.map(x=>`<div class="upcoming-item"><div class="upcoming-date"><strong>${String(x.date.getDate()).padStart(2,'0')}</strong><span>${x.date.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></div><div class="upcoming-copy"><strong>${esc(x.title)}</strong><span>${esc(x.sub)}</span></div></div>`).join('')}

function editActivity(i){const a=state.activities[i];openActivityForm(i,a)}

/* Feed */
function renderFeed(){const posts=visiblePosts();document.getElementById('feedContent').innerHTML=`<div class="feed-layout"><div><div id="feedComposer"></div><div class="feed-filters"><button class="filter-pill ${feedFilter==='all'?'active':''}" onclick="setFeedFilter('all')">Todos</button><button class="filter-pill ${feedFilter==='recent'?'active':''}" onclick="setFeedFilter('recent')">Recentes</button><button class="filter-pill ${feedFilter==='photo'?'active':''}" onclick="setFeedFilter('photo')">Com fotos</button></div><div id="feedList"></div></div><aside class="feed-side"><section class="card"><div class="card-head"><div><h3>Resumo</h3><p>Aprendizados visíveis</p></div></div><div class="card-body"><div class="side-stat"><span>Publicações</span><strong>${posts.length}</strong></div><div class="side-stat"><span>Comentários</span><strong>${posts.reduce((a,b)=>a+b.comments.length,0)}</strong></div><div class="side-stat"><span>Reconhecimentos</span><strong>${posts.reduce((a,b)=>a+b.likes,0)}</strong></div></div></section><section class="card"><div class="card-head"><div><h3>Próximo curso</h3><p>Agenda semanal</p></div></div><div class="card-body next-card"><small>${toBR(nextFriday())}</small><strong>Curso Espro</strong><span>Registre o principal aprendizado após a aula.</span></div></section></aside></div>`;
 document.getElementById('feedComposer').innerHTML=state.profile==='aprendiz'?`<section class="card composer"><div class="composer-row"><div class="composer-avatar">${initials(CURRENT_USER)}</div><button class="composer-button" onclick="openPostForm()">O que você aprendeu no curso?</button></div></section>`:'';renderFeedList();refreshIcons()}
function setFeedFilter(v){feedFilter=v;renderFeed()}
function renderFeedList(){const host=document.getElementById('feedList');if(!host)return;let posts=[...visiblePosts()].sort((a,b)=>b.id-a.id);if(feedFilter==='photo')posts=posts.filter(x=>x.photos?.length);if(feedFilter==='recent')posts=posts.slice(0,2);host.innerHTML=posts.length?posts.map(postCard).join(''):'<div class="card empty">Nenhuma publicação neste filtro.</div>';refreshIcons()}
function postCard(p){const liked=p.likedBy.includes(state.profile),commentsOpen=openComments.has(p.id);return `<article class="card post"><div class="post-head"><div class="post-avatar">${initials(p.employee)}</div><div class="post-author"><strong>${esc(p.employee)}</strong><span>${esc(employees.find(e=>e.name===p.employee)?.area||'Jovem Aprendiz')} • ${p.date} às ${p.time}</span></div></div><div class="post-body"><div class="post-course">${esc(p.course)}</div><div class="post-title">${esc(p.title)}</div><div class="post-text">${esc(p.done)}</div><div class="learning-box"><small>Principal aprendizado</small><p>${esc(p.learned)}</p></div><div class="skill-tags">${p.skills.map(s=>`<span class="skill-tag">${esc(s)}</span>`).join('')}</div></div>${p.photos?.length?`<div class="post-media ${p.photos.length>1?'multi':''}">${p.photos.map(x=>`<img src="${x}" alt="Foto da atividade">`).join('')}</div>`:''}<div class="post-meta"><span>${p.likes} reconhecimentos</span><span>${p.comments.length} comentários</span></div><div class="post-actions"><button class="post-action ${liked?'active':''}" onclick="toggleLike(${p.id})"><i data-lucide="thumbs-up"></i>Gostei</button><button class="post-action" onclick="toggleComments(${p.id})"><i data-lucide="message-circle"></i>Comentar</button><button class="post-action" onclick="copyPost(${p.id})"><i data-lucide="share-2"></i>Compartilhar</button></div><div class="comments ${commentsOpen?'open':''}">${p.comments.map(c=>`<div class="comment"><div class="comment-avatar">${initials(c.author)}</div><div class="comment-bubble"><strong>${esc(c.author)}</strong><span>${esc(c.text)}</span></div></div>`).join('')}<div class="comment-form"><input id="comment-${p.id}" class="field" placeholder="Adicionar comentário"><button class="btn btn-primary" onclick="addComment(${p.id})">Enviar</button></div></div></article>`}
function toggleLike(id){const p=state.posts.find(x=>x.id===id),idx=p.likedBy.indexOf(state.profile);if(idx>=0){p.likedBy.splice(idx,1);p.likes--}else{p.likedBy.push(state.profile);p.likes++}renderFeedList()}
function toggleComments(id){openComments.has(id)?openComments.delete(id):openComments.add(id);renderFeedList()}
function addComment(id){const input=document.getElementById(`comment-${id}`),text=input?.value.trim();if(!text)return;const p=state.posts.find(x=>x.id===id);p.comments.push({author:roleConfig[state.profile].name,text});openComments.add(id);renderFeedList()}
function copyPost(id){navigator.clipboard?.writeText(`Aprendizado no Apsen Aprendiz — publicação ${id}`).then(()=>toast('Referência copiada'))}

/* Communication */
function renderCommunication(){const copy={aprendiz:['Espro','Dúvidas sobre curso e programa'],gestor:['RH / Espro','Alinhamento da equipe'],rh:['Espro','Canal institucional'],espro:['Filipe Ferreira','Atendimento ao aprendiz']}[state.profile];document.getElementById('communicationContent').innerHTML=`<div class="comm-layout"><section class="card"><div class="card-head"><div><h3>Conversas</h3><p>Canais disponíveis</p></div></div><div class="conversation-list"><button class="conversation-item active"><div class="person-dot">${initials(copy[0])}</div><div><strong>${esc(copy[0])}</strong><span>${esc(copy[1])}</span></div></button></div></section><section class="card chat"><div class="chat-head"><div class="person-dot">${initials(copy[0])}</div><div><strong>${esc(copy[0])}</strong><span>${esc(copy[1])}</span></div></div><div class="messages" id="messages">${state.messages.map(m=>`<div class="message ${m.author==='me'?'me':''}">${esc(m.text)}<small>${m.author==='me'?'Você':esc(m.author)} • ${m.time}</small></div>`).join('')}</div><div class="chat-form"><input id="chatInput" class="field" placeholder="Escreva uma mensagem" onkeydown="if(event.key==='Enter') sendMessage()"><button class="btn btn-primary" onclick="sendMessage()"><i data-lucide="send"></i>Enviar</button></div></section></div>`;refreshIcons()}
function sendMessage(){const el=document.getElementById('chatInput'),text=el?.value.trim();if(!text)return;state.messages.push({author:'me',text,time:'agora'});renderCommunication()}

/* Notifications */
function renderNotifications(){document.getElementById('notificationsContent').innerHTML=`<section class="card"><div class="card-head"><div><h3>Atualizações</h3><p>${state.notifications.filter(x=>!x.read).length} não lidas</p></div></div><div class="card-body notification-list">${state.notifications.length?state.notifications.map((n,i)=>`<div class="notification ${n.read?'':'unread'}"><div class="notification-icon"><i data-lucide="${n.type==='warning'?'triangle-alert':n.type==='success'?'circle-check':'bell'}"></i></div><div class="notification-copy"><strong>${esc(n.text)}</strong><span>${n.read?'Lida':'Nova'}</span></div>${!n.read?`<button class="btn btn-secondary" onclick="readNotification(${i})">Marcar como lida</button>`:''}</div>`).join(''):'<div class="empty">Nenhuma notificação.</div>'}</div></section>`;renderNotificationsDot();refreshIcons()}
function readNotification(i){state.notifications[i].read=true;renderNotifications()}
function renderNotificationsDot(){const dot=document.getElementById('notificationDot');if(dot)dot.style.display=state.notifications.some(x=>!x.read)?'block':'none'}

/* Forms */
function openDocumentForm(){Swal.fire({title:'Enviar documento',html:`<div class="swal-form"><label>Data da ausência<input id="docDate" class="field" placeholder="dd/mm/aaaa"></label><label>Motivo<select id="docReason" class="select"><option>Consulta médica</option><option>Atendimento médico</option><option>Compromisso acadêmico</option><option>Outro</option></select></label><label>Arquivo<input id="docFile" class="field" type="file" accept=".pdf,.jpg,.jpeg,.png"></label></div>`,showCancelButton:true,confirmButtonText:'Enviar',cancelButtonText:'Cancelar',didOpen:()=>{if(window.flatpickr)flatpickr('#docDate',{locale:'pt',dateFormat:'d/m/Y'})},preConfirm:()=>{const date=document.getElementById('docDate').value,file=document.getElementById('docFile').files[0],reason=document.getElementById('docReason').value;if(!date||!file){Swal.showValidationMessage('Informe a data e selecione um arquivo.');return false}return {date,file,reason}}}).then(r=>{if(r.isConfirmed){state.documents.unshift({employee:CURRENT_USER,name:r.value.file.name,date:r.value.date,reason:r.value.reason,status:'Em análise',owner:'Espro'});state.notifications.unshift({text:`Documento ${r.value.file.name} enviado para análise.`,read:false,type:'info'});toast('Documento enviado');renderNotificationsDot();if(document.body.dataset.section==='documents')renderDocuments()}})}
function openAttendanceForm(){const options=employees.map(e=>`<option>${esc(e.name)}</option>`).join('');Swal.fire({title:'Registrar frequência',html:`<div class="swal-form"><label>Colaborador<select id="attEmployee" class="select">${options}</select></label><div class="swal-grid-2"><label>Data<input id="attDate" class="field" placeholder="dd/mm/aaaa"></label><label>Tipo<select id="attType" class="select"><option>Presença</option><option>Falta</option><option>Atraso</option></select></label></div><div class="swal-grid-2"><label>Status<select id="attStatus" class="select"><option>Confirmada</option><option>Justificada</option><option>Em análise</option><option>Injustificada</option></select></label><label>Origem<select id="attOrigin" class="select"><option>Curso Espro</option><option>Apsen</option></select></label></div><label>Observação<textarea id="attObs" class="textarea"></textarea></label></div>`,showCancelButton:true,confirmButtonText:'Registrar',cancelButtonText:'Cancelar',didOpen:()=>{if(window.flatpickr)flatpickr('#attDate',{locale:'pt',dateFormat:'d/m/Y'})},preConfirm:()=>{const date=document.getElementById('attDate').value;if(!date){Swal.showValidationMessage('Informe a data.');return false}return {employee:document.getElementById('attEmployee').value,date,type:document.getElementById('attType').value,status:document.getElementById('attStatus').value,origin:document.getElementById('attOrigin').value,obs:document.getElementById('attObs').value||'Registro realizado pelo Espro.'}}}).then(r=>{if(r.isConfirmed){state.attendance.unshift(r.value);toast('Frequência registrada');if(document.body.dataset.section==='attendance')renderAttendance()}})}
function editAttendance(employee,date){const a=state.attendance.find(x=>x.employee===employee&&x.date===date);if(!a)return;Swal.fire({title:'Atualizar ocorrência',html:`<div class="swal-form"><label>Status<select id="editAttStatus" class="select"><option ${a.status==='Confirmada'?'selected':''}>Confirmada</option><option ${a.status==='Justificada'?'selected':''}>Justificada</option><option ${a.status==='Em análise'?'selected':''}>Em análise</option><option ${a.status==='Injustificada'?'selected':''}>Injustificada</option></select></label><label>Observação<textarea id="editAttObs" class="textarea">${esc(a.obs)}</textarea></label></div>`,showCancelButton:true,confirmButtonText:'Salvar',preConfirm:()=>({status:document.getElementById('editAttStatus').value,obs:document.getElementById('editAttObs').value})}).then(r=>{if(r.isConfirmed){Object.assign(a,r.value);toast('Ocorrência atualizada');renderAttendance()}})}
function openActivityForm(index=null,current=null){Swal.fire({title:index===null?'Nova atividade':'Editar atividade',html:`<div class="swal-form"><label>Título<input id="actTitle" class="field" value="${esc(current?.title||'')}"></label><div class="swal-grid-2"><label>Data<input id="actDate" class="field" placeholder="dd/mm/aaaa" value="${esc(current?.date||'')}"></label><label>Formato<select id="actFormat" class="select"><option ${current?.format==='Presencial'?'selected':''}>Presencial</option><option ${current?.format==='Online'?'selected':''}>Online</option></select></label></div><label>Descrição<textarea id="actDesc" class="textarea">${esc(current?.desc||'')}</textarea></label><div id="actHint" style="font-size:9px;color:#667085"></div></div>`,showCancelButton:true,confirmButtonText:index===null?'Cadastrar':'Salvar',cancelButtonText:'Cancelar',didOpen:()=>{const input=document.getElementById('actDate');const update=()=>{if(!input.value)return;const d=brToDate(input.value);document.getElementById('actHint').textContent=d.getDay()===3?wednesdayLabel(d):'A atividade complementar deve ser em uma quarta-feira.'};if(window.flatpickr)flatpickr(input,{locale:'pt',dateFormat:'d/m/Y',defaultDate:current?.date||null,onChange:update});input.addEventListener('change',update);update()},preConfirm:()=>{const title=document.getElementById('actTitle').value.trim(),date=document.getElementById('actDate').value,format=document.getElementById('actFormat').value,desc=document.getElementById('actDesc').value.trim();if(!title||!date){Swal.showValidationMessage('Preencha título e data.');return false}const d=brToDate(date);if(d.getDay()!==3){Swal.showValidationMessage('A atividade deve ocorrer em uma quarta-feira.');return false}const conflict=state.activities.some((a,i)=>i!==index&&brToDate(a.date).getMonth()===d.getMonth()&&brToDate(a.date).getFullYear()===d.getFullYear());if(conflict){Swal.showValidationMessage('Já existe uma atividade complementar neste mês.');return false}return {title,date,format,desc,audience:'Todos os aprendizes',status:'Agendada',acknowledged:false,confirmed:current?.confirmed||0,total:current?.total||28}}}).then(r=>{if(r.isConfirmed){if(index===null)state.activities.push(r.value);else state.activities[index]={...state.activities[index],...r.value};state.activities.sort((a,b)=>brToDate(a.date)-brToDate(b.date));toast(index===null?'Atividade cadastrada':'Atividade atualizada');if(document.body.dataset.section==='activities')renderActivities()}})}
function openPostForm(){let photos=[];Swal.fire({title:'Registrar aprendizado',width:640,html:`<div class="swal-form"><label>Título<input id="postTitle" class="field" placeholder="Ex.: Comunicação no ambiente profissional"></label><div class="swal-grid-2"><label>Data<input id="postDate" class="field" value="02/10/2026"></label><label>Horário<input id="postTime" class="field" type="time" value="09:00"></label></div><label>Tema do curso<input id="postCourse" class="field"></label><label>O que foi feito<textarea id="postDone" class="textarea"></textarea></label><label>Principal aprendizado<textarea id="postLearned" class="textarea"></textarea></label><label>Competências <span style="font-weight:400;color:#98a2b3">(separe por vírgulas)</span><input id="postSkills" class="field"></label><label>Fotos<input id="postPhotos" class="field" type="file" accept="image/*" multiple></label><div id="postPreview" class="photo-preview"></div></div>`,showCancelButton:true,confirmButtonText:'Publicar',cancelButtonText:'Cancelar',didOpen:()=>{if(window.flatpickr)flatpickr('#postDate',{locale:'pt',dateFormat:'d/m/Y'});document.getElementById('postPhotos').addEventListener('change',e=>{photos=[];[...e.target.files].slice(0,4).forEach(file=>{const r=new FileReader();r.onload=ev=>{photos.push(ev.target.result);document.getElementById('postPreview').innerHTML=photos.map(x=>`<img src="${x}">`).join('')};r.readAsDataURL(file)})})},preConfirm:()=>{const title=document.getElementById('postTitle').value.trim(),date=document.getElementById('postDate').value,time=document.getElementById('postTime').value,course=document.getElementById('postCourse').value.trim(),done=document.getElementById('postDone').value.trim(),learned=document.getElementById('postLearned').value.trim(),skills=document.getElementById('postSkills').value.split(',').map(x=>x.trim()).filter(Boolean);if(!title||!date||!course||!done||!learned){Swal.showValidationMessage('Preencha os campos principais.');return false}return {title,date,time,course,done,learned,skills}}}).then(r=>{if(r.isConfirmed){state.posts.unshift({id:Date.now(),employee:CURRENT_USER,...r.value,photos,likes:0,likedBy:[],comments:[]});toast('Aprendizado publicado');setSection('feed')}})}

/* Reminder */
function showActivityReminder(force=false){if(state.profile!=='aprendiz')return;const a=nextActivity(),info=activityReminder(a);if(!force&&sessionStorage.getItem('activityReminderShown'))return;sessionStorage.setItem('activityReminderShown','1');Swal.fire({title:'Atividade complementar',html:`<div style="text-align:left"><p style="font-size:13px;font-weight:600;color:#172033">${esc(info.headline)}</p><p><strong>${esc(a.title)}</strong><br>${a.date} • ${esc(a.format)}</p><p style="color:#667085">${esc(a.desc)}</p></div>`,showCancelButton:true,confirmButtonText:'Ver na agenda',cancelButtonText:'Entendi'}).then(r=>{if(r.isConfirmed)setSection('calendar')})}

/* Search / export */
function runGlobalSearch(){const q=(document.getElementById('globalSearch')?.value||'').trim();if(!q)return;if(state.profile==='gestor'){setSection('attendance');document.getElementById('attendanceSearch').value=q;filterAttendanceTable()}else if(state.profile==='rh'){setSection('attendance');document.getElementById('attendanceSearch').value=q;filterAttendanceTable()}else if(state.profile==='espro'){setSection('documents');document.getElementById('documentSearch').value=q;filterDocumentsTable()}}
function downloadText(text,name,type){const blob=new Blob(['\ufeff'+text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* Boot */
document.getElementById('profileSelect').addEventListener('change',e=>{state.profile=e.target.value;sessionStorage.removeItem('activityReminderShown');applyRole();toast(`Ambiente: ${roleConfig[state.profile].name}`)});
window.addEventListener('load',()=>{configureHeader();updatePageMeta('dashboard');renderDashboard();renderNotificationsDot();setTimeout(()=>document.getElementById('splash').classList.add('out'),650);setTimeout(()=>showActivityReminder(false),900);refreshIcons()});
</script>
</body>
</html>
